name: PCRemote
options:
  bundleIdPrefix: com.titan
  deploymentTarget:
    iOS: "17.0"
targets:
  PCRemote:
    type: application
    platform: iOS
    sources: [PCRemote]
    info:
      path: PCRemote/Info.plist
      properties:
        CFBundleDisplayName: PC Remote
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Talks to the command server on your PC.
        CFBundleURLTypes:
          - CFBundleURLName: com.titan.pcremote
            CFBundleURLSchemes: [pcremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.titan.pcremote
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
