name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project PCRemote.xcodeproj -scheme PCRemote \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PCRemote.app Payload/
          zip -qr PCRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-ipa
          path: ios/PCRemote.ipa
