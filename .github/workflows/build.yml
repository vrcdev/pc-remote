name: Build IPA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project PCRemote.xcodeproj -scheme PCRemote \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PCRemote.app Payload/
          zip -qr PCRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-ipa
          path: ios/PCRemote.ipa
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ios/PCRemote.ipa \
            --title "PC Remote (latest build)" \
            --notes "Unsigned IPA. Sign and install with SideStore, AltStore, TrollStore or Sideloadly. Built from ${GITHUB_SHA::7}."
